<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Student</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<div class="home-card">

    <div class="logo">👤</div>

    <h1>Create Student</h1>

    <p class="subtitle">Добавление нового студента</p>

    <div class="line"></div>

    <form th:action="@{/mvc/students/create}"
          th:object="${student}"
          method="post">

        <div class="form-group">
            <label>Username</label>
            <input type="text" th:field="*{username}" placeholder="Введите username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Введите пароль">
        </div>

        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}" placeholder="Введите имя">
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" th:field="*{age}" placeholder="Введите возраст">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Введите email">
        </div>

        <button class="submit-btn" type="submit">
            Создать студента
        </button>
    </form>

    <div class="home-link">
        <a href="/mvc/students">Назад к студентам</a>
    </div>

</div>

</body>
</html>
