<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<div class="home-card">

    <div class="logo">✏️</div>

    <h1>Edit Student</h1>

    <p class="subtitle">Редактирование студента</p>

    <div class="line"></div>

    <form th:action="@{/mvc/students/edit/{id}(id=${studentId})}"
          th:object="${student}"
          method="post">

        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}">
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" th:field="*{age}">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}">
        </div>

        <button class="submit-btn" type="submit">Сохранить</button>
    </form>

    <div class="home-link">
        <a href="/mvc/dashboard" class="small-btn">Личный кабинет</a>
        <a href="/mvc/students">Назад к студентам</a>
    </div>

</div>

</body>
</html>
