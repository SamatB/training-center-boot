<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Enrollment</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<div class="home-card">

    <div class="logo">✅</div>

    <h1>Create Enrollment</h1>

    <p class="subtitle">Записать студента на курс</p>

    <div class="line"></div>

    <form th:action="@{/mvc/enrollments/create}"
          th:object="${enrollment}"
          method="post">

        <div class="form-group">
            <label>Student ID</label>
            <input type="number" th:field="*{studentId}" placeholder="ID студента" required>
        </div>

        <div class="form-group">
            <label>Course ID</label>
            <input type="number" th:field="*{courseId}" placeholder="ID курса" required>
        </div>

        <button class="submit-btn" type="submit">
            Записать на курс
        </button>
    </form>

    <div class="home-link">
        <a href="/mvc/dashboard" class="small-btn">Личный кабинет</a>
        <a href="/mvc/enrollments">Назад к записям</a>
    </div>

</div>

</body>
</html>
