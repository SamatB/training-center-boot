<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Teacher</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<div class="home-card">

    <div class="logo">🎓</div>

    <h1>Create Teacher</h1>

    <p class="subtitle">Добавление преподавателя</p>

    <div class="line"></div>

    <form th:action="@{/mvc/teachers/create}"
          th:object="${teacher}"
          method="post">

        <div class="form-group">
            <label>Username</label>
            <input type="text" th:field="*{username}" placeholder="Введите username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Введите пароль" required>
        </div>

        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}" placeholder="Введите имя" required>
        </div>

        <div class="form-group">
            <label>Experience</label>
            <input type="number" th:field="*{experience}" placeholder="Введите стаж" required>
        </div>

        <button class="submit-btn" type="submit">Создать преподавателя</button>
    </form>

    <div class="home-link">
        <a href="/mvc/dashboard" class="small-btn">Личный кабинет</a>
        <a href="/mvc/teachers">Назад к преподавателям</a>
    </div>

</div>

</body>
</html>
