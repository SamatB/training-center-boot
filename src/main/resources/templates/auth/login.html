<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<div class="home-card">

    <div class="logo">🔐</div>

    <h1>Login</h1>

    <p class="subtitle">
        Вход в систему
    </p>

    <div class="line"></div>

    <form action="/mvc/login" method="post">

        <div class="form-group">
            <label>Username</label>

            <input
                    type="text"
                    name="username"
                    placeholder="Введите username"
                    required
            >
        </div>

        <div class="form-group">
            <label>Password</label>

            <input
                    type="password"
                    name="password"
                    placeholder="Введите пароль"
                    required
            >
        </div>

        <button class="submit-btn" type="submit">
            Войти
        </button>

    </form>

    <div class="home-link">
        <a href="/">На главную</a>
    </div>

</div>

</body>
</html>
