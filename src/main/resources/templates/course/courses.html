<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<div class="table-card">

    <div class="page-header">

        <div>
            <h1>Courses</h1>
            <p class="subtitle">
                Управление курсами
            </p>
        </div>

        <div>
            <a sec:authorize="hasRole('ADMIN')"
               href="/mvc/courses/create" class="small-btn">+ Добавить курс</a>
            <a href="/mvc/dashboard" class="small-btn">Личный кабинет</a>
            <a href="/" class="small-btn">Главная</a>
        </div>

    </div>

    <form action="/mvc/courses/search"
          method="get"
          class="search-form">

        <input
                type="text"
                name="title"
                th:value="${searchValue}"
                placeholder="Поиск курса"
                class="search-input"
        >

        <button type="submit" class="small-btn">
            Search
        </button>

        <a href="/mvc/courses" class="small-btn">
            Reset
        </a>

    </form>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Цена</th>
            <th>Длительность</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="course : ${courses}">

            <td th:text="${course.id}"></td>

            <td th:text="${course.title}"></td>

            <td th:text="${course.price}"></td>

            <td th:text="${course.duration}"></td>

            <td class="actions">

                <a th:href="@{/mvc/courses/edit/{id}(id=${course.id})}"
                   class="action-btn edit-btn">
                    Edit
                </a>

                <form th:action="@{/mvc/courses/delete/{id}(id=${course.id})}"
                      method="post"
                      class="inline-form">

                    <button type="submit"
                            class="action-btn delete-btn">
                        Delete
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
